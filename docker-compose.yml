services:  
  shophub-backend:
    build:
      context: .
      dockerfile: Dockerfile
    
    image: shophub-backend:latest
    container_name: shophub-backend
    restart: unless-stopped

    env_file:
      - .env


    expose:
      - "8000"

    networks:
      - shophub-network

networks:
  shophub-network:
    external: true
  